version: 2

models:
  - name: fact_transactions
    tests:
      - relationships:
          from: card_key
          to: ref('dim_card')
          field: card_key
      - relationships:
          from: merchant_key
          to: ref('dim_merchant')
          field: merchant_key

    columns:
      - name: amount
        tests:
          - dbt_utils.expression_is_true:
              expression: "amount >= 0"
      - name: currency
        tests:
          - accepted_values:
              values: ['USD', 'CAD', 'EUR']
